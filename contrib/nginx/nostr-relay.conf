# Infer Relay — production site config for nginx
#
# Usage:
#   sed 's/your-domain.example/your-actual-domain.example/g' \
#       contrib/nginx/nostr-relay.conf \
#       | sudo tee /etc/nginx/sites-available/your-actual-domain.example.conf
#   sudo ln -s /etc/nginx/sites-available/your-actual-domain.example.conf \
#             /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the cert:
#   sudo certbot --nginx -d your-actual-domain.example
#
# Note: `nginx -t` fails until the cert files referenced below exist. On a
# fresh host, bootstrap a throwaway self-signed cert at those paths first —
# see docs/docker-production.md Step 6 for the exact commands.
#
# Assumes:
#   - Relay reachable at 127.0.0.1:4000 (set in config.toml `[network] port`)
#   - TLS cert will live at /etc/letsencrypt/live/<domain>/
#   - nginx >= 1.18 (Debian 12 / Ubuntu 24.04 default)

# WebSocket upgrade helper (required for HTTP/1.1 -> WS upgrade on /).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS redirect (also handles ACME HTTP-01 challenge).
server {
    listen      80;
    listen [::]:80;
    server_name your-domain.example;

    # ACME HTTP-01 challenge: certbot --webroot uses this path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS -- TLS-terminating reverse proxy in front of the relay container.
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 brings little to a WebSocket relay (WS clients negotiate
    # HTTP/1.1 anyway), and the `http2` directive requires nginx >= 1.25.1
    # while Debian 12 / Ubuntu 24.04 ship 1.22 / 1.24. Uncomment if newer:
    # http2 on;
    server_name your-domain.example;

    # Cert files -- populated by `certbot --nginx -d <domain>`.
    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # Modern TLS profile (Mozilla Intermediate, 2024).
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    ssl_stapling               on;
    ssl_stapling_verify        on;

    # Security headers (certbot --nginx adds HSTS automatically; we restate
    # all four here for clarity and to survive manual edits).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "no-referrer"                       always;

    # Don't leak nginx version on error pages.
    server_tokens off;

    # Forward to the relay container. Assumes docker-compose maps the
    # container's port 4000 to the host's loopback interface. If your
    # relay is on a different host/port, change the proxy_pass URL.
    location / {
        proxy_pass http://127.0.0.1:4000;

        # Required for WebSocket upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward real client info to the relay. The relay reads these via
        # `[network] remote_ip_header = "x-forwarded-for"` in config.toml.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections (WebSocket subscribers stay connected for hours).
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 5s;

        # Don't buffer WebSocket frames.
        proxy_buffering          off;
        proxy_request_buffering  off;

        # Reduce latency for small WS frames.
        tcp_nodelay on;
    }

    # Optional: expose /metrics to Prometheus on a separate internal listener
    # if you terminate TLS elsewhere. Tighten allow/deny to your scraper CIDR.
    #
    # location /metrics {
    #     proxy_pass http://127.0.0.1:4000/metrics;
    #     allow 10.0.0.0/8;
    #     deny  all;
    # }
}
